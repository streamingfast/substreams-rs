name: Publish release

on:
  pull_request:
    types:
      - closed
    branches:
      - "develop"
    paths:
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to run the publish steps for again, e.g. v0.8.1"
        required: true

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  SFRELEASER_VERSION: "v0.17.1-rc.5"

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.tag }}
          fetch-depth: 0

      - name: Install sfreleaser
        run: |
          curl -sSfL "https://github.com/streamingfast/sfreleaser/releases/download/$SFRELEASER_VERSION/sfreleaser_linux_x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP" sfreleaser
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Detect version
        id: detect
        if: github.event_name == 'pull_request'
        run: sfreleaser release detect

      - name: Publish release
        if: steps.detect.outputs.is_release_pr || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.detect.outputs.version || inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: sfreleaser release publish "$VERSION"
